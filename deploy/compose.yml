services:
  app:
    build:
      context: ..
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      AHR_ENV: ${AHR_ENV:-development}
      AHR_DEMO_MODE: "false"
      AHR_BOOTSTRAP_PASSWORD: ${AHR_BOOTSTRAP_PASSWORD:?Set a unique bootstrap password}
      AHR_DATABASE_URL: postgresql+psycopg://ahr:${POSTGRES_PASSWORD:?Set PostgreSQL password}@postgres:5432/ahr
      AHR_REDIS_URL: redis://:${REDIS_PASSWORD:?Set Redis password}@redis:6379/0
      AHR_ALLOWED_ORIGINS: ${AHR_ALLOWED_ORIGINS:-http://127.0.0.1:8765,http://localhost:8765}
      AHR_LLM_BASE_URL: ${AHR_LLM_BASE_URL:-}
      AHR_LLM_API_KEY: ${AHR_LLM_API_KEY:-}
      AHR_LLM_MODEL: ${AHR_LLM_MODEL:-}
      AHR_VISION_MODEL: ${AHR_VISION_MODEL:-}
      AHR_EMBEDDING_MODEL: ${AHR_EMBEDDING_MODEL:-}
      AHR_SAM_MODEL_DIR: ${AHR_SAM_MODEL_DIR:-}
      AHR_RETRIEVAL_MODEL_DIR: ${AHR_RETRIEVAL_MODEL_DIR:-}
      AHR_RETRIEVAL_BACKEND: ${AHR_RETRIEVAL_BACKEND:-dinov2}
      AHR_SEGMENTATION_CHECKPOINT: ${AHR_SEGMENTATION_CHECKPOINT:-}
      AHR_INPAINT_METHOD: ${AHR_INPAINT_METHOD:-interpolation}
      AHR_INPAINT_CHECKPOINT: ${AHR_INPAINT_CHECKPOINT:-}
      AHR_ALLOW_EXTERNAL_MODELS: ${AHR_ALLOW_EXTERNAL_MODELS:-false}
      AHR_STORAGE: ${AHR_STORAGE:-local}
      AHR_OBS_ENDPOINT: ${AHR_OBS_ENDPOINT:-}
      AHR_OBS_BUCKET: ${AHR_OBS_BUCKET:-}
      AHR_OBS_ACCESS_KEY: ${AHR_OBS_ACCESS_KEY:-}
      AHR_OBS_SECRET_KEY: ${AHR_OBS_SECRET_KEY:-}
    volumes:
      - ahr_runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ahr
      POSTGRES_USER: ahr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set PostgreSQL password}
    volumes:
      - ahr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahr -d ahr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set Redis password}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set Redis password}
    volumes:
      - ahr_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  ahr_runtime:
  ahr_postgres:
  ahr_redis:

